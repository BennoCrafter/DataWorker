<!DOCTYPE html>
<html lang="de" data-theme="light">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>DataWorker</title>
		<link rel="stylesheet" href="/vendor/ios26/fonts.css">
		<link rel="stylesheet" href="/vendor/ios26/colors.css">
		<link rel="stylesheet" href="/vendor/ios26/typography.css">
		<link rel="stylesheet" href="/vendor/ios26/spacing.css">
		<link rel="stylesheet" href="/vendor/ios26/materials.css">
		<link rel="stylesheet" href="/vendor/ios26/animations.css">
		<link rel="stylesheet" href="/app.css">
	</head>
	<body>
		<div id="app">
			<header id="topbar" class="material-chrome">
				<div class="brand">
					<span class="tile"><i data-lucide="layout-grid" width="16" height="16" stroke-width="2.4"></i></span>
					<span class="text-headline emphasized" id="brand-name">DataWorker</span>
				</div>
				<div class="right">
					<!-- appears when the updates feature finds something newer (or a restart is pending) -->
					<button id="update-btn" class="hidden">
						<i data-lucide="arrow-down-circle" width="15" height="15"></i>
						<span class="text-footnote emphasized" data-i18n="update.headerLabel">Update</span>
					</button>
					<!-- appears only while an update is downloading/installing, or showing its result —
					     not a permanent fixture, this app has nothing else to report here -->
					<div id="activity-wrap" class="hidden">
						<button id="activity-btn" class="liquid-glass-sm"></button>
						<div id="activity-pop" class="material-chrome hidden"></div>
					</div>
					<div id="settings-wrap">
						<button id="settings-btn" class="icon-btn plain" data-i18n-title="topbar.settings" title="Settings">
							<i data-lucide="settings" width="18" height="18"></i>
						</button>
						<div id="settings-pop" class="material-chrome hidden"></div>
					</div>
				</div>
			</header>

			<main>
				<aside id="sidebar">
					<div class="sidebar-head">
						<span class="text-caption1 emphasized sidebar-title" data-i18n="sidebar.title">Bibliotheken</span>
						<div class="sidebar-actions">
							<button id="import-csv-btn" class="icon-btn plain" data-i18n-title="sidebar.importCsv" title="CSV importieren…">
								<i data-lucide="upload" width="16" height="16"></i>
							</button>
							<button id="new-library-btn" class="icon-btn plain" data-i18n-title="sidebar.newLibrary" title="Neue Bibliothek…">
								<i data-lucide="plus" width="16" height="16"></i>
							</button>
						</div>
					</div>
					<div id="library-list"></div>
				</aside>
				<section id="library-view"></section>
			</main>
		</div>

		<!-- library modals (new library / manage fields) render here -->
		<div id="modal-layer" class="hidden"></div>

		<script src="/vendor/lucide.min.js"></script>
		<script type="module" src="/js/main.js"></script>
	</body>
</html>
