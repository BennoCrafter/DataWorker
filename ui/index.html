<!DOCTYPE html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Bento</title>
		<link rel="stylesheet" href="/vendor/ios26/fonts.css">
		<link rel="stylesheet" href="/vendor/ios26/colors.css">
		<link rel="stylesheet" href="/vendor/ios26/typography.css">
		<link rel="stylesheet" href="/vendor/ios26/spacing.css">
		<link rel="stylesheet" href="/vendor/ios26/materials.css">
		<link rel="stylesheet" href="/vendor/ios26/animations.css">
		<link rel="stylesheet" href="/app.css">
	</head>
	<body>
		<div id="app">
			<header id="topbar" class="material-chrome">
				<div class="brand">
					<span class="tile"><i data-lucide="layout-grid" width="16" height="16" stroke-width="2.4"></i></span>
					<span class="text-headline emphasized" id="brand-name">Bento</span>
				</div>
				<div class="right">
					<div id="settings-wrap">
						<button id="settings-btn" class="icon-btn plain" title="Settings">
							<i data-lucide="settings" width="18" height="18"></i>
						</button>
						<div id="settings-pop" class="material-chrome hidden"></div>
					</div>
				</div>
			</header>

			<main>
				<aside id="sidebar">
					<div class="sidebar-head">
						<span class="text-caption1 emphasized sidebar-title">Bibliotheken</span>
						<div class="sidebar-actions">
							<button id="import-csv-btn" class="icon-btn plain" title="CSV importieren…">
								<i data-lucide="upload" width="16" height="16"></i>
							</button>
							<button id="new-library-btn" class="icon-btn plain" title="Neue Bibliothek…">
								<i data-lucide="plus" width="16" height="16"></i>
							</button>
						</div>
					</div>
					<div id="library-list"></div>
				</aside>
				<section id="library-view"></section>
			</main>
		</div>

		<!-- library modals (new library / manage fields) render here -->
		<div id="modal-layer" class="hidden"></div>

		<!-- prerequisites feature: the startup gate renders here, over everything -->
		<div id="prereq-layer" class="hidden"></div>

		<script src="/vendor/lucide.min.js"></script>
		<script type="module" src="/js/main.js"></script>
	</body>
</html>
