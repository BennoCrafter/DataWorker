name: Build DataWorker for macOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build .app
        run: deno task build

      - name: Package .app for download
        run: ditto -c -k --sequesterRsrc --keepParent \
          "dist/DataWorker.app" \
          "DataWorker-macOS-arm64.zip"

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: DataWorker-macOS-arm64
          path: DataWorker-macOS-arm64.zip
          if-no-files-found: error
